[project]
name = "primebb"
version = "0.1.0"
description = "BitBrowser Gmail OAuth automation backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "playwright>=1.44.0",
    "pyotp>=2.9.0",
    "2captcha-python>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
